        :root {
            --bg-color: #f4f7f6;

            --link-color: #007bff;
            --link-hover: #0056b3;
            --spinner-bg: #f3f3f3;
            --spinner-color: #3498db;
            --box-shadow: rgba(0,0,0,0.08);

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --box-bg: #1e1e1e;
                --text-main: #e0e0e0;
                --text-muted: #a0a0a0;
                --text-footer: #666666;
                --link-color: #64b5f6;
                --link-hover: #90caf9;
                --spinner-bg: #333333;
                --spinner-color: #64b5f6;
                --box-shadow: rgba(0,0,0,0.4);
            }
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .box {
            text-align: center;
            padding: 30px;
            background: var(--box-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px var(--box-shadow);
            width: 350px;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .spinner {
            border: 3px solid var(--spinner-bg);
            border-top: 3px solid var(--spinner-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        p {
            margin: 0 0 10px 0;
            font-size: 15px;
        }

        #status {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        footer {
            position: absolute;
            bottom: 25px;
            font-size: 13px;
            color: var(--text-footer);
            text-align: center;
            width: 100%;
        }

        footer a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        .success-icon {
            display: inline-block;
            width: 40px;
            height: 40px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #2ecc71;
            color: white;
            font-size: 24px;
            line-height: 40px;
            text-align: center;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>

	function getInstalledFontsCount(seed) {
		try {
			const baseFonts = ['monospace', 'sans-serif', 'serif'];
			const testSize = '72px';

			let testString = "";
			const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

				seedNum = (Math.imul(seedNum, 1664525) + 1013904223) | 0;
				const index = Math.abs(seedNum) % chars.length;
				testString += chars[index];
			}

			const canvas = document.createElement('canvas');
			const ctx = canvas.getContext('2d');
			if (!ctx) return 0;

			const baselines = {};
			for (let i = 0; i < baseFonts.length; i++) {
				ctx.font = testSize + ' ' + baseFonts[i];
				baselines[baseFonts[i]] = ctx.measureText(testString).width;
			}

			const fontList = [
				'Arial', 'Arial Black', 'Arial Hebrew', 'Arial MT', 'Arial Rounded MT Bold',

				'Verdana', 'Ubuntu', 'Cantarell', 'DejaVu Sans', 'Liberation Sans'
			];

			let detectedCount = 0;

			for (let i = 0; i < fontList.length; i++) {
				let detected = false;
				for (let j = 0; j < baseFonts.length; j++) {
					ctx.font = testSize + ' \'' + fontList[i] + '\', ' + baseFonts[j];
					const currentWidth = ctx.measureText(testString).width;

	function calculateSpotCheck(seed) {
		try {
			const canvas = document.createElement('canvas');
			canvas.width = 100;
			canvas.height = 100;
			const ctx = canvas.getContext('2d');
			if (!ctx) return "";
			ctx.imageSmoothingEnabled = false;

			const numericSeed = parseInt(seed.substring(0, 8), 16) || 123456789;
			let state = numericSeed;

			function nextRand() {
				state = (Math.imul(state, 1664525) + 1013904223) | 0;
				return (state >>> 16);
			}

			for (let i = 0; i < 5; i++) {
				const x = nextRand() % 100;
				const y = nextRand() % 100;
				const w = (nextRand() % 50) + 10;
				const h = (nextRand() % 50) + 10;

				ctx.fillStyle = 'rgb(255, 0, 0)';
				ctx.fillRect(x, y, w, h);
			}

			const imgData = ctx.getImageData(0, 0, 100, 100).data;

			let hexString = "";
			let currentByte = 0;

			for (let i = 0; i < 10000; i++) {
				const isFilled = imgData[i * 4] > 128 ? 1 : 0;
				const bitPosition = i % 8;

				if (isFilled) {
					currentByte |= (1 << bitPosition);
				}

				if (bitPosition === 7) {
					hexString += currentByte.toString(16).padStart(2, '0');
					currentByte = 0;
				}
			}
			return hexString;
		} catch (e) {
			return "";
		}
	}

	function solvePowWithWorker(seed, diff, fp, botSignals) {
		return new Promise((resolve, reject) => {

			try {

				const blob = new Blob([workerCode], { type: 'application/javascript' });
				const workerUrl = URL.createObjectURL(blob);
				const worker = new Worker(workerUrl);

				const timeout = setTimeout(() => {
					worker.terminate();
					URL.revokeObjectURL(workerUrl);
					reject("Worker Timeout");
				}, 90000);

				worker.postMessage({
					wasmBase64: WASM_BINARY_B64,
					seed: seed,
					difficulty: diff,
					fp: fp,
					botSignals: botSignals

				worker.onmessage = (event) => {
					clearTimeout(timeout);
					worker.terminate();
					URL.revokeObjectURL(workerUrl);

					if (event.data.success) resolve(event.data.nonce);
					else reject(event.data.error);

					clearTimeout(timeout);
					worker.terminate();
					URL.revokeObjectURL(workerUrl);
					reject(error.message);

			} catch(err) {
				reject(err.toString());
			}
		});
