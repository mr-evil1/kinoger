name: Scrape KinoGer

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: kinoger-push
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Scrape KinoGer
        run: python scripts/scrape_kinoger.py

      - name: Commit data
        run: |
          git config user.email "scrapebot@github"
          git config user.name "scrapebot"
          git add data/ html/
          git diff --cached --quiet && echo "keine Aenderungen" && exit 0
          git commit -m "update kinoger data"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && echo "Push OK" && exit 0
            echo "Retry $i failed, waiting..."
            sleep $((i * 3))
          done

          echo "ERROR: Push failed after 5 retries" >&2
          exit 1
