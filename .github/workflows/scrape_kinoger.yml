name: Scrape KinoGer

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: kinoger-push
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get install -y xvfb
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch cookie
        run: xvfb-run --auto-servernum python scripts/fetch_cookie.py

      - name: Git config
        run: |
          git config user.email "scrapebot@github"
          git config user.name "scrapebot"

      - name: Scrape KinoGer
        run: xvfb-run --auto-servernum python scripts/scrape_kinoger.py

      - name: Commit cookies
        run: |
          git add cookies/
          git diff --cached --quiet && echo "keine Aenderungen" && exit 0
          git commit -m "update cookies [skip ci]"
          git pull --rebase origin main && git push || true
