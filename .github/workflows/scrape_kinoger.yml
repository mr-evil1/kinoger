name: Scrape KinoGer

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get install -y xvfb
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Scrape KinoGer
        run: xvfb-run --auto-servernum python scripts/scrape_kinoger.py

      - name: Commit data
        run: |
          git config user.email "scrapebot@github"
          git config user.name "scrapebot"
          git add data/ cookies/
          git diff --cached --quiet && echo "keine Änderungen" || (
            git commit -m "chore: update kinoger data $(date -u '+%Y-%m-%d %H:%M')"
            git push
          )
