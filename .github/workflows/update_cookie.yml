name: Refresh Kinoger Cookie

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: kinoger-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get install -y xvfb
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch cookie
        run: xvfb-run --auto-servernum python scripts/fetch_cookie.py

      - name: Commit cookie
        run: |
          git config user.email "cookiebot@github"
          git config user.name "cookiebot"
          git add cookies/kinoger.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: refresh kinoger cookie"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && echo "Push OK" && exit 0
            echo "Retry $i failed, waiting..."
            sleep $((i * 3))
          done

          echo "ERROR: Push failed after 5 retries" >&2
          exit 1
